<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Required — Xloop</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0c0c0e;font-family:'Inter',system-ui,sans-serif;color:#fff;
    background-image:radial-gradient(ellipse at 20% 50%,rgba(229,9,20,0.06) 0%,transparent 60%),
                     radial-gradient(ellipse at 80% 20%,rgba(59,130,246,0.05) 0%,transparent 60%)}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;padding:48px 40px;max-width:420px;width:100%;text-align:center;
    backdrop-filter:blur(20px);box-shadow:0 32px 80px rgba(0,0,0,0.5)}
  .lock{font-size:2.5rem;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(229,9,20,0.4))}
  h1{font-size:1.4rem;font-weight:800;margin-bottom:8px;letter-spacing:-0.3px}
  p{font-size:0.88rem;color:rgba(255,255,255,0.45);line-height:1.6;margin-bottom:28px}
  .input-wrap{position:relative;margin-bottom:12px}
  input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
    border-radius:10px;padding:13px 16px;color:#fff;font-size:0.9rem;outline:none;
    transition:border-color 0.2s}
  input:focus{border-color:rgba(229,9,20,0.5)}
  input::placeholder{color:rgba(255,255,255,0.25)}
  button{width:100%;background:#E50914;color:#fff;border:none;border-radius:10px;
    padding:13px;font-size:0.9rem;font-weight:700;cursor:pointer;
    transition:background 0.2s,transform 0.15s,box-shadow 0.2s;letter-spacing:0.02em}
  button:hover{background:#f40612;transform:translateY(-1px);box-shadow:0 8px 24px rgba(229,9,20,0.35)}
  .err{color:#f87171;font-size:0.8rem;margin-top:8px;display:none}
  .brand{font-size:0.75rem;color:rgba(255,255,255,0.18);margin-top:28px;letter-spacing:0.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="lock"></div>
  <h1>Private Access Only</h1>
  <p>This site is invite-only. Enter your invite code below to continue.</p>
  <div class="input-wrap">
    <input type="text" id="codeInput" placeholder="Paste your invite code…" autocomplete="off" spellcheck="false">
  </div>
  <button onclick="submitCode()">Enter Site</button>
  <div class="err" id="errMsg">Invalid code. Please check and try again.</div>
  <div class="brand">Xloop · Private Beta</div>
</div>
<script>
  function submitCode() {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) return;
    document.cookie = `xloop_invite=${encodeURIComponent(code)}; max-age=2592000; path=/`;
    window.location.href = '/';
  }
  document.getElementById('codeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitCode();
  });
  // Show error if redirected back with ?err=1
  if (new URLSearchParams(location.search).get('err')) {
    document.getElementById('errMsg').style.display = 'block';
  }
</script>
</body>
</html>
