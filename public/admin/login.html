<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin Login - XLOOP</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">XLOOP</div>
      <div class="login-sub">Admin Access</div>
      
      <form class="login-form" id="loginForm">
        <div id="loginErr" class="login-err"></div>
        <input type="text" id="username" class="form-input" placeholder="Username" required>
        <input type="password" id="password" class="form-input" placeholder="Password" required>
        <button type="submit" class="btn-primary" style="margin-top: 10px;">Login</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginErr');
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('xloop_admin_token', data.token);
          window.location.href = '/admin/dashboard.html';
        } else {
          errEl.textContent = data.message;
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Server error. Try again.';
        errEl.style.display = 'block';
      }
    });
  </script>

<!-- Vercel Web Analytics -->

  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
