<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Search — XLOOP</title>
  <meta name="description" content="Search for movies, TV shows and anime on XLOOP.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Search page extras ─────────────────────────────────────── */
    .search-hero {
      padding: calc(var(--nav-h, 64px) + 32px) 32px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      background: linear-gradient(180deg, rgba(229,9,20,0.06) 0%, transparent 100%);
    }
    .search-title {
      font-size: 1rem; font-weight: 700; color: var(--text2);
      text-transform: uppercase; letter-spacing: 1.5px;
    }
    .search-input-wrap {
      display: flex; align-items: center; gap: 0;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 999px; overflow: hidden;
      width: 100%; max-width: 680px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .search-input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(229,9,20,0.18);
    }
    .search-input-wrap .si-icon {
      padding: 0 14px 0 18px; color: var(--text2); flex-shrink: 0; display: flex; align-items: center;
    }
    .search-input-wrap input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 1rem; padding: 14px 0;
      font-family: inherit; min-width: 0;
    }
    .search-input-wrap input::placeholder { color: var(--text3); }
    .search-input-wrap button {
      background: var(--accent); color: #fff; border: none;
      padding: 10px 22px; font-weight: 700; font-size: 0.88rem;
      cursor: pointer; margin: 4px; border-radius: 999px;
      transition: opacity 0.2s, transform 0.15s; flex-shrink: 0;
    }
    .search-input-wrap button:hover { opacity: 0.85; transform: scale(0.98); }
    .search-input-wrap button:active { transform: scale(0.95); }

    /* Type filter pills */
    .type-tabs {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      margin-top: 4px;
    }
    .type-tab {
      padding: 6px 18px; border-radius: 999px; font-size: 0.8rem; font-weight: 700;
      border: 1.5px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
      color: var(--text2); cursor: pointer; transition: all 0.2s; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .type-tab:hover { border-color: rgba(229,9,20,0.5); color: var(--text); }
    .type-tab.active {
      background: rgba(229,9,20,0.15); border-color: var(--accent);
      color: #fff; box-shadow: 0 0 0 1px rgba(229,9,20,0.3);
    }

    /* Search count / status */
    .search-status {
      font-size: 0.84rem; color: var(--text2); text-align: center;
      min-height: 22px; transition: opacity 0.3s;
    }
    .search-status strong { color: var(--text); }

    /* Suggestions box (live autocomplete) */
    .search-suggestions {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      z-index: 500; display: none;
    }
    .search-suggestions.open { display: block; max-height: min(360px, 55vh); overflow-y: auto; overscroll-behavior: contain; }
    .suggestion-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; cursor: pointer; transition: background 0.15s;
      color: var(--text);
    }
    .suggestion-item:hover { background: rgba(229,9,20,0.1); }
    .suggestion-item img {
      width: 36px; height: 50px; object-fit: cover; border-radius: 5px;
      background: #222; flex-shrink: 0;
    }
    .suggestion-item-info { flex: 1; min-width: 0; }
    .suggestion-item-title { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggestion-item-meta { font-size: 0.74rem; color: var(--text2); margin-top: 2px; }
    .suggestion-badge {
      font-size: 0.66rem; font-weight: 700; padding: 2px 7px; border-radius: 4px;
      background: rgba(229,9,20,0.18); color: var(--accent); flex-shrink: 0;
    }

    /* Wrap for positioning suggestions */
    .search-input-outer {
      position: relative; width: 100%; max-width: 680px;
    }

    /* Pagination */
    .search-pagination { display: flex; gap: 8px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
    .search-pg-btn {
      padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text2); cursor: pointer; font-size: 0.85rem;
      font-weight: 600; transition: all 0.2s; font-family: inherit;
    }
    .search-pg-btn:hover, .search-pg-btn.active {
      border-color: var(--accent); color: #fff; background: rgba(229,9,20,0.15);
    }
    .search-pg-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .search-pg-info { padding: 8px 16px; color: var(--text2); font-size: 0.85rem; font-weight: 600; }

    /* Results motion and loading feedback */
    #searchResults { min-height: 120px; position: relative; }
    #searchResults.loaded .card { animation: searchCardIn .28s cubic-bezier(.2,.75,.25,1) both; animation-delay: calc(var(--card-index, 0) * 18ms); }
    #searchResults.loading { opacity: .86; transition: opacity .18s ease; }
    #searchResults.loading::before {
      content: ""; position: absolute; z-index: 2; top: -5px; left: 0;
      width: 30%; height: 2px; border-radius: 99px;
      background: var(--accent); box-shadow: 0 0 12px rgba(229,9,20,.5);
      animation: searchProgress 1s ease-in-out infinite;
    }
    .search-loading-state {
      grid-column: 1 / -1; min-height: 150px; display: flex;
      align-items: center; justify-content: center; gap: 12px;
      color: var(--text2); font-size: .9rem;
    }
    @keyframes searchProgress {
      0% { transform: translateX(-20%); opacity: .45; }
      50% { opacity: 1; }
      100% { transform: translateX(250%); opacity: .45; }
    }
    .search-suggestions { transform-origin: top center; }
    .search-suggestions.open { animation: suggestionIn .16s ease-out both; }
    .suggestion-item { border-bottom: 1px solid rgba(255,255,255,.045); }
    .suggestion-item:last-child { border-bottom: 0; }
    .search-empty { grid-column: 1 / -1; animation: searchCardIn .28s ease both; }
    @keyframes searchCardIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes suggestionIn { from { opacity: 0; transform: translateY(-6px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      #searchResults.loaded .card, .search-suggestions.open, .search-empty { animation: none !important; }
      .search-input-wrap, .type-tab, .suggestion-item { transition: none !important; }
    }

    /* Empty state */
    .search-empty {
      text-align: center; padding: 80px 20px; color: var(--text2);
    }
    .search-empty-icon { font-size: 3.5rem; margin-bottom: 16px; opacity: 0.5; }
    .search-empty h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .search-empty p { font-size: 0.9rem; color: var(--text2); }

    @media (max-width: 640px) {
      .search-hero { padding: calc(var(--nav-h, 64px) + 16px) 14px 16px; }
      .search-input-wrap input { font-size: 16px !important; }
      .search-input-wrap button { padding: 8px 16px; font-size: 0.8rem; }
      .type-tabs {
        width: 100%; flex-wrap: nowrap; justify-content: flex-start;
        overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .type-tabs::-webkit-scrollbar { display: none; }
      .type-tab { flex: 0 0 auto; padding: 8px 15px; min-height: 38px; }
      .search-status { max-width: 100%; line-height: 1.45; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">XLOOP</a>
      <ul class="nav-links">

          <input type="text" id="navSearchInput" placeholder="Search titles..." autocomplete="off">

  <!-- SEARCH HERO -->
  <div class="search-hero">

    <div class="search-input-outer">
      <form class="search-input-wrap" id="mainSearchForm" autocomplete="off">
        <span class="si-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <input type="text" id="mainSearchInput" placeholder="Search movies, TV shows, anime..." autofocus aria-label="Search movies, TV shows and anime" aria-autocomplete="list" aria-controls="searchSuggestions" aria-expanded="false" spellcheck="false">
        <button type="submit">Search</button>
      </form>
      <!-- Live autocomplete dropdown -->

    <!-- Type filter tabs -->
    <div class="type-tabs" id="typeTabs">

  <!-- RESULTS -->
  <section class="section" style="padding-top:8px; flex:1;">
    <div class="content-grid" id="searchResults" aria-busy="false"></div>
    <div class="search-pagination" id="searchPagination" aria-label="Search result pages"></div>
  </section>

  <footer class="footer">

  <!-- Mobile Nav Overlay -->
  <div class="mobile-nav-overlay" id="mobileNavOverlay">

    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">

    </svg>
  </button>

  <script src="/js/app.js"></script>
  <script>


    // Normalize extra whitespace but always preserve spaces between title words.
    function normalizeSearchQuery(value) {
      return String(value ?? '').replace(/\s+/g, ' ').trim();
    }

    // Sync navbar search input with main search input
    document.getElementById('navSearchForm').addEventListener('submit', e => {
      e.preventDefault();
      const q = normalizeSearchQuery(document.getElementById('navSearchInput').value);
      if (q) {
        mainInput.value = q;
        runSearch(q, 1);
      }
    });

    // ── Navbar scroll ───────────────────────────────────────────────────────────
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);
    });

    // ── State ───────────────────────────────────────────────────────────────────
    let currentQuery    = '';
    let currentType     = '';
    let currentPage     = 1;
    let debounceTimer = null;
    let suggestTimer = null;
    let searchRequestId = 0;
    let suggestRequestId = 0;
    let searchAbortController = null;
    let suggestionAbortController = null;

    // ── Elements ─────────────────────────────────────────────────────────────────
    const mainInput      = document.getElementById('mainSearchInput');
    const mainForm       = document.getElementById('mainSearchForm');
    const resultsGrid    = document.getElementById('searchResults');
    const paginationEl   = document.getElementById('searchPagination');
    const statusEl       = document.getElementById('searchStatus');
    const suggestBox     = document.getElementById('searchSuggestions');

    // Suggestions use text/attribute escaping and delegated clicks (no HTML event handlers).
    suggestBox.addEventListener('click', event => {
      const item = event.target.closest('.suggestion-item[data-watch-id]');
      if (!item) return;
      goToWatch(item.dataset.watchId, item.dataset.watchType || 'movie');
    });

    // ── Type tab wiring ──────────────────────────────────────────────────────────
    document.querySelectorAll('.type-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        clearTimeout(debounceTimer);
        clearTimeout(suggestTimer);
        closeSuggestions();
        document.querySelectorAll('.type-tab').forEach(t => {
          t.classList.remove('active');
          t.setAttribute('aria-pressed', 'false');
        });
        tab.classList.add('active');
        tab.setAttribute('aria-pressed', 'true');
        currentType = tab.dataset.type || '';
        currentQuery = normalizeSearchQuery(mainInput.value);
        runSearch(currentQuery, 1);
      });
    });

    mainInput.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown') {
        const first = suggestBox.querySelector('.suggestion-item');
        if (first) { event.preventDefault(); first.focus(); }
      }
    });
    suggestBox.addEventListener('keydown', event => {
      const items = [...suggestBox.querySelectorAll('.suggestion-item')];
      const index = items.indexOf(document.activeElement);
      if (event.key === 'ArrowDown' && index < items.length - 1) {
        event.preventDefault(); items[index + 1].focus();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (index > 0) items[index - 1].focus(); else mainInput.focus();
      } else if (event.key === 'Enter' && index >= 0) {
        event.preventDefault();
        goToWatch(items[index].dataset.watchId, items[index].dataset.watchType || 'movie');
      } else if (event.key === 'Escape') {
        closeSuggestions(); mainInput.focus();
      }
    });

    // ── Form submit ──────────────────────────────────────────────────────────────
    mainForm.addEventListener('submit', e => {
      e.preventDefault();
      const q = mainInput.value.trim();
      if (q) runSearch(q, 1);
      closeSuggestions();
    });

    // ── Live search (debounce 350ms) ─────────────────────────────────────────────
    mainInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      clearTimeout(suggestTimer);
      closeSuggestions();

      const q = mainInput.value.trim();
      currentQuery = q;
      document.getElementById('navSearchInput').value = q;

      // A new keystroke invalidates and aborts the previous full search immediately.
      // This prevents slow responses from repainting results for an older query.
      searchRequestId++;
      if (searchAbortController) {
        searchAbortController.abort();
        searchAbortController = null;
      }

      if (resultsGrid.children.length) {
        resultsGrid.classList.add('loading');
        resultsGrid.setAttribute('aria-busy', 'true');
      }

      if (!q) {
        setStatus('Showing recent content…');
        debounceTimer = setTimeout(() => runSearch('', 1), 280);
        return;
      }

      if (q.length < 2) {
        resultsGrid.classList.remove('loading');
        resultsGrid.setAttribute('aria-busy', 'false');
        paginationEl.innerHTML = '';
        renderSearchGrid('<div class="search-empty"><h3>Keep typing…</h3><p>Enter at least 2 characters to search.</p></div>');
        setStatus('Enter at least 2 characters to search');
        return;
      }

      setStatus('Updating results…');
      // Suggestions stay lightweight; full results wait until typing pauses.
      suggestTimer = setTimeout(() => loadSuggestions(q), 220);
      debounceTimer = setTimeout(() => runSearch(q, 1), 420);
    });

    // Close suggestions on outside click
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-input-outer')) closeSuggestions();
    });

    // ── Suggestions (fast, small limit) ─────────────────────────────────────────
    async function loadSuggestions(q) {
      if (suggestionAbortController) suggestionAbortController.abort();
      const controller = new AbortController();
      suggestionAbortController = controller;
      const requestId = ++suggestRequestId;
      try {
        const url = `/api/search?q=${encodeURIComponent(q)}&limit=6${currentType ? '&type=' + currentType : ''}`;
        const res  = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (requestId !== suggestRequestId || controller.signal.aborted) return;
        const items = Array.isArray(data.results) ? data.results : [];
        if (!items.length) { closeSuggestions(); return; }

        suggestBox.innerHTML = items.map(item => {
          const badge = item.type === 'movie' ? 'MOVIE' : item.type === 'anime' ? 'ANIME' : 'SERIES';
          const id = escapeSearchHtml(item._id || '');
          const type = ['movie', 'series', 'anime'].includes(item.type) ? item.type : 'movie';
          const poster = escapeSearchHtml(item.poster || '');
          const title = escapeSearchHtml(item.title || 'Untitled');
          const year = escapeSearchHtml(item.year || '');
          const rating = escapeSearchHtml(item.rating || '');
          return `
            <div class="suggestion-item" role="option" tabindex="0" data-watch-id="${id}" data-watch-type="${type}">
              <img src="${poster}" onerror="this.style.display='none'" alt="${title}" loading="lazy">
              <div class="suggestion-item-info">
                <div class="suggestion-item-title">${title}</div>
                <div class="suggestion-item-meta">${year} ${rating}</div>
              </div>
              <span class="suggestion-badge">${badge}</span>
            </div>`;
        }).join('');
        suggestBox.classList.add('open');
        mainInput.setAttribute('aria-expanded', 'true');
      } catch (error) {
        if (requestId === suggestRequestId && !controller.signal.aborted) closeSuggestions();
      } finally {
        if (requestId === suggestRequestId) suggestionAbortController = null;
      }
    }

    function closeSuggestions() {
      suggestRequestId++;
      if (suggestionAbortController) {
        suggestionAbortController.abort();
        suggestionAbortController = null;
      }
      suggestBox.innerHTML = '';
      suggestBox.classList.remove('open');
      mainInput.setAttribute('aria-expanded', 'false');
    }
    function goToWatch(id, type) { window.location.href = `/watch.html?id=${id}&type=${type}`; }

    // ── Main search ──────────────────────────────────────────────────────────────
    function escapeSearchHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function createSafeSearchCard(item, index) {
      const id = encodeURIComponent(String(item._id || ''));
      const type = ['movie', 'series', 'anime'].includes(item.type) ? item.type : 'movie';
      const title = escapeSearchHtml(item.title || 'Untitled');
      const poster = escapeSearchHtml(item.poster || '');
      const year = escapeSearchHtml(item.year || '');
      const label = type === 'movie' ? 'Movie' : type === 'anime' ? 'Anime' : 'Series';
      const badge = type === 'anime' ? 'ANIME' : type === 'series' ? 'SERIES' : (item.quality === '4K' ? '4K' : 'HD');
      const delay = Math.min(index, 18);
      const image = poster
        ? `<img src="${poster}" alt="${title}" class="card-img" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="card-no-poster" style="display:none"><div class="np-title">${title}</div></div>`
        : `<div class="card-no-poster"><div class="np-title">${title}</div></div>`;
      return `<a href="/watch.html?id=${id}&amp;type=${type}" class="card" style="--card-index:${delay}"><div class="card-badge">${badge}</div>${image}<div class="card-info"><div class="card-title">${title}</div><div class="card-sub">${year} • ${label}</div></div></a>`;
    }

    function renderSearchGrid(html) {
      resultsGrid.classList.remove('loading', 'loaded');
      resultsGrid.innerHTML = html;
      resultsGrid.setAttribute('aria-busy', 'false');
      requestAnimationFrame(() => resultsGrid.classList.add('loaded'));
    }

    async function runSearch(q, page = 1) {
      q = normalizeSearchQuery(q);
      clearTimeout(debounceTimer);
      clearTimeout(suggestTimer);
      currentQuery = q;
      currentPage = page;

      if (q && q.length < 2) {
        if (searchAbortController) searchAbortController.abort();
        searchAbortController = null;
        searchRequestId++;
        resultsGrid.classList.remove('loading');
        resultsGrid.setAttribute('aria-busy', 'false');
        paginationEl.innerHTML = '';
        renderSearchGrid('<div class="search-empty"><h3>Keep typing…</h3><p>Enter at least 2 characters to search.</p></div>');
        setStatus('Enter at least 2 characters to search');
        return;
      }

      if (searchAbortController) searchAbortController.abort();
      const controller = new AbortController();
      searchAbortController = controller;
      const requestId = ++searchRequestId;

      // Never write an older captured query back into the field while the user is typing.
      document.getElementById('navSearchInput').value = q;

      // Keep the URL in sync without leaving an empty ?q= parameter.
      const urlQ = new URLSearchParams();
      if (q) urlQ.set('q', q);
      if (currentType) urlQ.set('type', currentType);
      window.history.replaceState({}, '', urlQ.toString() ? `?${urlQ.toString()}` : window.location.pathname);

      // Preserve the last good grid during refreshes; show a compact loader only on first load.
      resultsGrid.classList.remove('loaded');
      resultsGrid.classList.add('loading');
      resultsGrid.setAttribute('aria-busy', 'true');
      if (!resultsGrid.firstElementChild) {
        resultsGrid.innerHTML = '<div class="search-loading-state" role="status"><span class="spinner"></span><span>Loading results…</span></div>';
      }
      paginationEl.innerHTML = '';
      setStatus(q ? 'Searching…' : 'Loading recent content…');

      try {
        let url = `/api/search?q=${encodeURIComponent(q)}&page=${page}&limit=24`;
        if (currentType) url += `&type=${currentType}`;

        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (requestId !== searchRequestId || controller.signal.aborted) return;

        const items = Array.isArray(data.results) && data.results.length > 0
          ? data.results
          : [...(data.movies || []), ...(data.series || [])];

        if (!items.length) {
          const safeQuery = escapeSearchHtml(q);
          renderSearchGrid(`
            <div class="search-empty">
              <div class="search-empty-icon">⌕</div>
              <h3>No results for "<strong>${safeQuery}</strong>"</h3>
              <p>Try a shorter title, alternate spelling, or another content type.</p>
            </div>`);
          setStatus(`No results found for "<strong>${safeQuery}</strong>"`);
        } else {
          renderSearchGrid(items.map((item, i) => createSafeSearchCard(item, i)).join(''));
          activateLazyImages();
          const visibleCount = Number(data.total ?? items.length).toLocaleString();
          const countMessage = data.truncated
            ? `Showing the top <strong>${visibleCount}</strong> of <strong>${Number(data.matchedTotal).toLocaleString()}</strong> matches`
            : `Found <strong>${visibleCount}</strong> results`;
          setStatus(`${countMessage} for "<strong>${escapeSearchHtml(q)}</strong>"`);
          buildPagination(data.total || items.length, page, 24);
        }
      } catch (err) {
        if (requestId !== searchRequestId || err.name === 'AbortError') return;
        renderSearchGrid(`<div class="search-empty"><div class="search-empty-icon">!</div><h3>Search failed</h3><p>${escapeSearchHtml(err.message)}</p><button class="search-pg-btn" type="button" onclick="runSearch(currentQuery,currentPage)">Try again</button></div>`);
        setStatus('Search failed. Please try again.');
      } finally {
        if (requestId === searchRequestId) {
          searchAbortController = null;
          resultsGrid.classList.remove('loading');
          resultsGrid.setAttribute('aria-busy', 'false');
        }
      }
    }

    // ── Pagination ───────────────────────────────────────────────────────────────
    function buildPagination(total, page, limit) {
      const pages = Math.ceil(total / limit);
      if (pages <= 1) { paginationEl.innerHTML = ''; return; }

      let html = '';
      if (page > 1) html += `<button class="search-pg-btn" onclick="runSearch(currentQuery,${page-1})">← Prev</button>`;
      html += `<span class="search-pg-info">Page ${page} of ${pages}</span>`;
      if (page < pages) html += `<button class="search-pg-btn" onclick="runSearch(currentQuery,${page+1})">Next →</button>`;
      paginationEl.innerHTML = html;
    }

    // ── Status helper ─────────────────────────────────────────────────────────────
    function setStatus(msg) { statusEl.innerHTML = msg; }

    // ── Init: read URL params ────────────────────────────────────────────────────
    (function init() {
      const params = new URLSearchParams(window.location.search);
      const q    = params.get('q') || '';
      const requestedType = params.get('type') || '';
      const type = ['', 'movie', 'series', 'anime'].includes(requestedType) ? requestedType : '';

      if (type) currentType = type;
      document.querySelectorAll('.type-tab').forEach(t => {
        const active = t.dataset.type === currentType;
        t.classList.toggle('active', active);
        t.setAttribute('aria-pressed', String(active));
      });

      if (q) {
        mainInput.value = q;
        runSearch(q, parseInt(params.get('page') || '1'));
      } else {
        // No query — show recent content
        runSearch('', 1);
      }
    })();
  </script>
