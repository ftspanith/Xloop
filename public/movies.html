  <script src="/js/app.js"></script>
  <script>
    document.getElementById('navSearchForm').addEventListener('submit', e => {
      e.preventDefault();
      const q = document.getElementById('navSearchInput').value.trim();
      if (q) window.location.href = `/search.html?q=${encodeURIComponent(q)}`;
    });
let currentPage = 1;
    
    async function loadMovies(page = 1) {
      currentPage = page;
      const genre   = document.getElementById('genreFilter').value;
      const year    = document.getElementById('yearFilter').value;
      const quality = document.getElementById('qualityFilter').value;
      const lang    = document.getElementById('langFilter').value;

      let url = `/api/movies?type=movie&page=${page}&limit=20`;
      if (genre)   url += `&genre=${genre}`;
      if (year)    url += `&year=${year}`;
      if (quality) url += `&quality=${quality}`;
      if (lang)    url += `&language=${encodeURIComponent(lang)}`;
      
      const container = document.getElementById('moviesGrid');
      
      // Fade out
      container.classList.add('loading');
      container.classList.remove('loaded');
      
      await new Promise(r => setTimeout(r, 200));
      container.innerHTML = '<div class="spinner"></div>';
      container.classList.remove('loading');
      
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const items = Array.isArray(data) ? data
          : Array.isArray(data?.movies) ? data.movies
          : Array.isArray(data?.results) ? data.results
          : [];
        
        if (!items.length) {
          container.innerHTML = '<div class="empty-state">No movies found</div>';
          document.getElementById('moviesPagination').innerHTML = '';
          container.classList.add('loaded');
          return;
        }
        
        let html = '';
        items.forEach((item, index) => {
          html += createCard(item, item.type || 'movie', index);
        });
        container.innerHTML = html;
        container.classList.add('loaded');
        activateLazyImages();
        
        const totalPages = Math.ceil((Number(data?.total) || items.length) / 20);
        let pagHtml = '';
        if (totalPages > 1) {
          if (currentPage > 1) {
            pagHtml += `<button class="btn-sm" onclick="loadMovies(${currentPage - 1})">← Prev</button>`;
          }
          pagHtml += `<span style="font-size: 0.85rem; color: var(--text2); margin: 0 15px; font-weight: 500;">Page ${currentPage} of ${totalPages}</span>`;
          if (currentPage < totalPages) {
            pagHtml += `<button class="btn-sm" onclick="loadMovies(${currentPage + 1})">Next →</button>`;
          }
        }
        document.getElementById('moviesPagination').innerHTML = pagHtml;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        console.error('Content page load failed:', err);
        container.innerHTML = '<div class="empty-state">Unable to load content. <button type="button" onclick="loadMovies(currentPage)">Retry</button></div>';
        container.classList.add('loaded');
      }
    }

    // Load movies on page load (script is at bottom of body, DOM is already ready)
    loadMovies(1);

    // Handle filters
    ['genreFilter', 'yearFilter', 'qualityFilter', 'langFilter'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', () => loadMovies(1));
    });

    // Populate years then init custom selects
    const yearFilter = document.getElementById('yearFilter');
    const currentYear = new Date().getFullYear();
    for (let y = currentYear; y >= 2000; y--) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      yearFilter.appendChild(opt);
    }

    // ── Upgrade all <select class="filter-select"> to custom pill dropdowns ──
    // Uses shared initCustomSelects() from /js/app.js
    initCustomSelects();
  </script>
