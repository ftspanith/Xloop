name: Telegram Sync Contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'routes/scrape.js'
      - 'public/admin/dashboard.html'
      - 'scripts/telegram-sync-upload.js'
      - 'test/telegram-sync-contract.test.js'
      - 'package.json'
      - '.github/workflows/telegram-sync-contract.yml'
  push:
    branches: [fix/telegram-sync-main]
    paths:
      - 'routes/scrape.js'
      - 'public/admin/dashboard.html'
      - 'scripts/telegram-sync-upload.js'
      - 'test/telegram-sync-contract.test.js'
      - 'package.json'
      - '.github/workflows/telegram-sync-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Telegram sync contract tests
        run: npm run test:telegram-sync
