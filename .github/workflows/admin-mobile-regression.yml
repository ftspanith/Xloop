name: Admin, Scraper & Pipeline Regression

on:
  push:
    branches:
      - test/mobile-dual-upload
    paths:
      - 'public/admin/**'
      - 'public/admin/manager.html'
      - 'routes/scrape.js'
      - 'routes/orchestrator.js'
      - 'pipeline_full.js'
      - 'scrape_api.js'
      - 'import-telegram-json-to-mongodb.js'
      - 'utils/parser.js'
      - 'test/telegram-mongodb-import.test.js'
      - 'scrape_api.js'
      - 'import-telegram-json-to-mongodb.js'
      - 'utils/parser.js'
      - 'test/telegram-mongodb-import.test.js'
      - 'models/ExtractedLink.js'
      - 'package.json'
      - 'test/admin-mobile-regression.test.js'
      - '.github/workflows/admin-mobile-regression.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'public/admin/**'
      - 'routes/scrape.js'
      - 'models/ExtractedLink.js'
      - 'package.json'
      - 'test/admin-mobile-regression.test.js'
      - '.github/workflows/admin-mobile-regression.yml'

jobs:
  admin-mobile-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run admin UI regression tests
        run: npm run test:admin-ui
      - name: Run Telegram JSON importer tests
        run: npm run test:telegram-import
