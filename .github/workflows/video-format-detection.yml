name: Video Format Detection Tests

on:
  push:
    branches: [main]
    paths:
      - 'utils/parser.js'
      - 'tests/video-format-detection.test.js'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'utils/parser.js'
      - 'tests/video-format-detection.test.js'
      - 'package.json'

jobs:
  video-format-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run video format detection tests
        run: npm run test:video-formats
