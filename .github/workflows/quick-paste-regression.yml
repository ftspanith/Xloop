name: Quick Paste Regression Tests

on:
  push:
    branches:
      - feature/quick-paste-phase1
  pull_request:
    branches:
      - main

jobs:
  quick-paste-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Quick Paste regression tests
        run: npm run test:quickpaste
